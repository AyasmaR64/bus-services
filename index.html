<!doctype html>
<html lang="si">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bus services</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./lib/maplibre-gl.css" />
  </head>
  <body data-theme="light">
    <section id="search-page" class="page active">
      <header id="fullscreen-header" class="header">
        <div style="position: fixed; left: 0; top: 0">
          <img src="images/hero.png" style="height: 50px" />
        </div>
        <div
          style="
            position: fixed;
            top: 8px;
            right: 20px;
            color: #fef48c;
            text-align: right;
            font-size: 14px;
          "
        >
          <span style="color: #ffffff"
            ><b id="brand-main">ප්‍රවාහන බස් </b></span
          >සේවා<br />
          <span style="color: #e8f397; font-size: 12px; font-weight: bold"
            ><i id="brand-sub">බලංගොඩ </i></span
          >
        </div>
        <hr class="hr1" />
      </header>

      <main class="main-container">
        <div class="left-panel">
          <div class="card">
            <label id="label-route">බස් මාර්ගය</label>
            <select id="routeSelect">
              <option value="BL-01" selected>බලංගොඩ-වේලිඔය-හම්බෙගමුව</option>
              <option value="BL-02">බලංගොඩ-වැලිපතයාය-කල්තොට</option>
              <option value="BL-03">බලංගොඩ-රජවක-මුල්ගම</option>
            </select>

            <label id="label-service">බස් සේවාව</label>

            <select id="bus-service">
              <option value="normal" selected>
                සාමාන්‍ය (ලංගම සහ පුද්ගලික)
              </option>
              <option value="express">දුර ගමන් සේවා</option>
              <option value="AC">AC</option>
              <option value="sltb">ශ්‍රී ලංගම</option>
              <option value="private">පුද්ගලික</option>
            </select>

            <label id="label-from">ගමනාරමිභය</label>
            <select id="fromSelect">
              <option value="Balangoda" selected>බලංගොඩ</option>
              <option value="Kirimatitenna">කිරිමැටිතැන්න</option>
              <option value="Depalamulla">දෙපෑලමුල්ල</option>
              <option value="Bowatta">බෝවත්ත</option>
              <option value="Rajavaka">රජවක</option>
              <option value="Kaltota">කල්තොට</option>
              <option value="Welioya">වේලිඔය</option>
            </select>

            <label id="label-to">ගමනාන්තය</label>
            <select id="toSelect">
              <option value="Balangoda">බලංගොඩ</option>
              <option value="Kirimatitenna">කිරිමැටිතැන්න</option>
              <option value="Depalamulla">දෙපෑලමුල්ල</option>
              <option value="Bowatta">බෝවත්ත</option>
              <option value="Rajavaka">රජවක</option>
              <option value="Kaltota">කල්තොට</option>
              <option value="Welioya" selected>වේලිඔය</option>
            </select>

            <label id="label-time">වේලාව</label>
            <input type="time" id="timeInput" />

            <div class="searchBtn" id="searchBtn">සොයන්න</div>
          </div>

          <div class="card result-card">
            <span class="pill" id="servicePill" style="display: none"></span>
            <label id="label-result">ප්‍රතිපල</label>
            <h3 id="resultShort" style="margin: 6px">--</h3>
            <div id="resultStops">
              <div>
                <strong id="fromName">--</strong>
                <span id="fromTime">--:--</span>
              </div>
              <div>
                <strong id="toName">--</strong> <span id="toTime">--:--</span>
              </div>
            </div>
            <h1 id="resultTime" style="margin: 10px; font-size: 28px">--:--</h1>
            <div class="nav-btns">
              <button class="btn-sm" id="prevBusBtn">
                <i class="fa fa-chevron-left"></i> පසුගිය
              </button>
              <button class="btn-sm" id="nextBusBtn">
                මීළඟ <i class="fa fa-chevron-right"></i>
              </button>
            </div>

            <div
              id="resultDetails"
              style="margin-top: 10px; font-size: 14px; color: #d7d7d7"
            ></div>
          </div>

          <div class="card">
            <label>බස් සිමියුලේටරය (GPX)</label>
            <input
              type="file"
              id="gpxFile"
              accept=".gpx"
              style="border: none; padding: 0"
            />
            <div class="nav-btns">
              <button
                class="btn-sm"
                id="startSimBtn"
                style="
                  background: rgb(87, 98, 36);
                  color: #ffffff;
                  font-weight: bold;
                "
              >
                ආරම්භ කරන්න
              </button>
              <button
                class="btn-sm"
                id="stopSimBtn"
                style="background: rgb(96, 108, 38)"
              >
                නවත්වන්න
              </button>
            </div>
          </div>
        </div>
      </main>
    </section>

    <script src="./lib/turf.min.js"></script>

    <section id="map-page" class="page">
      <div class="map-full-container">
        <!-- Re-uses the same map instance. -->
        <div id="map-full" class="map-full">
          <div class="map-container">
            <div id="map"></div>
            <script src="./lib/pmtiles.js"></script>
            <script src="./lib/maplibre-gl.js"></script>
            <div class="map-buttons">
              <button id="setFromBtn" title="Set From">
                <i class="fa fa-location-dot"></i>
              </button>
              <button id="setToBtn" title="Set To">
                <i class="fa fa-location-pin"></i>
              </button>
              <button id="centerBtn" title="Locate me">
                <i class="fa fa-location-crosshairs"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="saved-page" class="page">
      <div id="main-content">
        <div class="section-card">
          <div class="saved-title">
            <div>
              <p>Saved Bus Stops</p>
            </div>

            <div>
              <div class="stops-border"></div>
              <img class="bus-stops" src="images/map-marker-alt.svg" />
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="settings-page" class="page">
      <div id="main-content">
        <div class="section-card">
          <div>
            <div class="saved-title">
              <div>
                <p>Settings</p>
              </div>

              <div>
                <img class="cogwheel" src="images/settings.svg" />
                <img class="cogwheel-2" src="images/settings.svg" />
              </div>
            </div>
          </div>

          <div style="padding: 12px">
            <label for="langSelect">Language</label>
            <select id="langSelect">
              <option value="si">සිංහල</option>
              <option value="ta">தமிழ்</option>
              <option value="en">English</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <nav class="bottom-nav">
        <div onclick="showPage('search-page', this)" class="nav-item active">
          <div>
            <img src="images/bus.png" />
          </div>
          <div>Buses</div>
        </div>
        <div onclick="showPage('map-page', this)" class="nav-item">
          <div>
            <img src="images/map.png" />
          </div>
          <div>Map</div>
        </div>
        <div onclick="showPage('saved-page', this)" class="nav-item">
          <div>
            <img src="images/saved.png" />
          </div>
          <div>Saved</div>
        </div>
        <div onclick="showPage('settings-page', this)" class="nav-item">
          <div>
            <img src="images/settings.svg" />
          </div>
          <div>Settings</div>
        </div>
      </nav>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
